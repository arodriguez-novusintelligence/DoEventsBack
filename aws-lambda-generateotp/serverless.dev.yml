org: events
service: aws-lambda-generateotp
frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs20.x
  region: sa-east-1
  stage: dev
  environment:
    OTP_TABLE: OTPCode-dev
    CLIENT_TABLE: Client-dev
    PREFERENCES_TABLE: Preferences-dev
    USER_PREFERENCES_TABLE: UserPreferences-dev
    SES_FROM_EMAIL: notificaciones.doevents@doeventsapp.com
    WHATSAPP_PHONE_ID: ${env:WHATSAPP_PHONE_ID, '588313857701989'}
    META_ACCESS_TOKEN: ${env:META_ACCESS_TOKEN, ''}
    CORS_ALLOWED_ORIGINS: https://dev.doeventsapp.com,http://localhost:5173,https://localhost,capacitor://localhost
    WEB_APP_BASE_URL: https://dev.doeventsapp.com
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:Query
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:Scan
      Resource:
        - arn:aws:dynamodb:sa-east-1:519010577666:table/OTPCode-dev
        - arn:aws:dynamodb:sa-east-1:519010577666:table/Client-dev
        - arn:aws:dynamodb:sa-east-1:519010577666:table/Client-dev/index/EmailIndex
        - arn:aws:dynamodb:sa-east-1:519010577666:table/Client-dev/index/PhoneIndex
        - arn:aws:dynamodb:sa-east-1:519010577666:table/Preferences-dev
        - arn:aws:dynamodb:sa-east-1:519010577666:table/UserPreferences-dev
    - Effect: Allow
      Action:
        - ses:SendEmail
        - ses:SendRawEmail
      Resource: "*"
    - Effect: Allow
      Action:
        - sns:Publish
      Resource: "*"

functions:
  generateOtp:
    handler: src/generateOtp.handler
    events:
      - httpApi:
          path: /generateOtp
          method: post
  generateToken:
    handler: src/getToken.generateToken
    events:
      - httpApi:
          path: /generateToken
          method: post
  getPreferences:
    handler: src/preferences.getPreferences
    events:
      - httpApi:
          path: /preference
          method: get
  saveUserPreferences:
    handler: src/preferences.saveUserPreferences
    events:
      - httpApi:
          path: /userPreference
          method: post

package:
  patterns:
    - 'src/**'
    - 'node_modules/**'
    - '!**/*.md'
    - '!**/test-*.json'
    - '!**/payload*.json'
    - '!**/otp-*.json'
    - '!**/out.json'
    - '!**/response.json'
    - '!**/*.yaml'
