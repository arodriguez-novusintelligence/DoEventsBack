# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: events
service: chat-room-events
frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs24.x # Actualizado a la versión más reciente de Node.js
  region: us-east-1
  stage: ${self:custom.stage}

  environment:
    STAGE: ${self:custom.stage}
    WS_API_ENDPOINT: ${env:WS_API_ENDPOINT, ''}
    ENABLE_CHAT_IDEMPOTENCY: ${env:ENABLE_CHAT_IDEMPOTENCY, 'true'}
    CHAT_IDEMPOTENCY_TABLE: ${env:CHAT_IDEMPOTENCY_TABLE, 'ChatMessageIdempotency'}
    CHAT_IDEMPOTENCY_TTL_SECONDS: ${env:CHAT_IDEMPOTENCY_TTL_SECONDS, '604800'}

  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:*
        - s3:*
        - lambda:InvokeFunction
      Resource:
        - arn:aws:dynamodb:us-east-1:519010577666:table/Chats
        - arn:aws:dynamodb:us-east-1:519010577666:table/Chats/index*

        - arn:aws:dynamodb:us-east-1:519010577666:table/ChatMessage
        - arn:aws:dynamodb:us-east-1:519010577666:table/ChatMessage/index*

        - arn:aws:dynamodb:us-east-1:519010577666:table/ChatMessageIdempotency
        - arn:aws:dynamodb:us-east-1:519010577666:table/ChatMessageIdempotency/index*

        - arn:aws:dynamodb:us-east-1:519010577666:table/Client
        - arn:aws:dynamodb:us-east-1:519010577666:table/Client/index*

        - arn:aws:dynamodb:us-east-1:519010577666:table/Eventos
        - arn:aws:dynamodb:us-east-1:519010577666:table/Eventos/index/*

        - arn:aws:s3:::doeventprofileimagesbucket
        - arn:aws:s3:::doeventschatroombucket
        - arn:aws:lambda:us-east-1:519010577666:function:*
  iam:
    role:
      statements: # Cambiado de 'role' a 'statements' para la configuración de IAM
        - Effect: Allow
          Action:
            - execute-api:ManageConnections
            - lambda:InvokeFunction
          Resource: "arn:aws:execute-api:us-east-1:519010577666:*/@connections/*"

# Menos peso por deploy: sin firebase-admin ni basura; sigue siendo un zip compartido entre funciones.
package:
  excludeDevDependencies: true
  patterns:
    - "!.git/**"
    - "!.serverless/**"
    - "!**/*.md"
    - "!.env"
    - "!.env.*"

custom:
  stage: ${opt:stage, 'dev'}

functions:
  # APIS REST

  getChatRoomByEventId:
    handler: src/apis/getChatRoomByEventId.handler
    events:
      - http:
          path: chat-room-by-event/{eventId}
          method: get

  getChatMessagesByRoomId:
    handler: src/apis/getChatMessagesByRoomId.handler
    events:
      - http:
          path: chat-messages-by-room/{roomId}
          method: get

  getChatsRoomsByUserId:
    handler: src/apis/getChatsRoomsByUserId.handler
    events:
      - http:
          path: chats-rooms-by-user/{userId}
          method: get

  getOrCreateDirectChatRoom:
    handler: src/apis/getOrCreateDirectChatRoom.handler
    events:
      - http:
          path: get-or-create-direct-chat-room
          method: post

  sendInvitationChatRoom:
    handler: src/apis/sendInvitationChatRoom.handler
    events:
      - http:
          path: send-invitation-chat-room
          method: put

  kickedOutUserByChatRoom:
    handler: src/apis/kickedOutUserByChatRoom.handler
    events:
      - http:
          path: kicked-out-user-by-chat-room
          method: put

  promoteUserToAdminChatRoom:
    handler: src/apis/promoteUserToAdminChatRoom.handler
    events:
      - http:
          path: promote-user-to-admin-chat-room
          method: put

  demoteUserFromAdminChatRoom:
    handler: src/apis/demoteUserFromAdminChatRoom.handler
    events:
      - http:
          path: demote-user-from-admin-chat-room
          method: put

  exitChatRoom:
    handler: src/apis/exitChatRoom.handler
    events:
      - http:
          path: exit-chat-room
          method: put

  blacklistChatRoom:
    handler: src/apis/blacklistChatRoom.handler
    events:
      - http:
          path: blacklist-chat-room
          method: put

  unblacklistChatRoom:
    handler: src/apis/unblacklistChatRoom.handler
    events:
      - http:
          path: unblacklist-chat-room
          method: put

  acceptInvitationChatRoom:
    handler: src/apis/acceptInvitationChatRoom.handler
    events:
      - http:
          path: accept-invitation-chat-room
          method: put

  declineInvitationChatRoom:
    handler: src/apis/declineInvitationChatRoom.handler
    events:
      - http:
          path: decline-invitation-chat-room
          method: put

  deleteChatRoomById:
    handler: src/apis/deleteChatRoomById.handler
    events:
      - http:
          path: delete-chat-room-by-id
          method: put

  initChatMediaUpload:
    handler: src/apis/initChatMediaUpload.handler
    events:
      - http:
          path: chat-media-upload/init
          method: post
      - http:
          path: chat-media-upload/init
          method: options

  completeChatMediaUpload:
    handler: src/apis/completeChatMediaUpload.handler
    events:
      - http:
          path: chat-media-upload/complete
          method: post
      - http:
          path: chat-media-upload/complete
          method: options

  archiveChatRoom:
    handler: src/apis/archiveChatRoom.handler
    events:
      - http:
          path: archive-chat-room
          method: put

  unarchiveChatRoom:
    handler: src/apis/unarchiveChatRoom.handler
    events:
      - http:
          path: unarchive-chat-room
          method: put

  createPrivateGroupChat:
    handler: src/apis/createPrivateGroupChat.handler
    events:
      - http:
          path: create-private-group-chat
          method: post

  # WebSocket Handlers
  wsConnect:
    handler: src/gateways/wsConnect.handler
    events:
      - websocket:
          route: $connect

  wsDisconnect:
    handler: src/gateways/wsDisconnect.handler
    events:
      - websocket:
          route: $disconnect

  joinRoom:
    handler: src/gateways/joinRoom.handler
    events:
      - websocket:
          route: joinRoom

  sendChatMessage:
    handler: src/gateways/sendChatMessage.handler
    events:
      - websocket:
          route: sendChatMessage

  editChatMessage:
    handler: src/gateways/editChatMessage.handler
    events:
      - websocket:
          route: editChatMessage
