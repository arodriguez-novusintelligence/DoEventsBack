org: events
service: aws-lambda-backoffice

provider:
  name: aws
  runtime: nodejs20.x
  region: sa-east-1
  stage: dev
  environment:
    CLIENT_TABLE: Client-dev
    EVENTS_TABLE: Eventos-dev
    ORDERS_TABLE: Orders-dev
    VENUES_TABLE: Venues-dev
    VENUE_PROMO_CODES_TABLE: VenuePromoCodes-dev
    SERVICE_PROMO_CODES_TABLE: ServicePromoCodes-dev
    SERVICES_TABLE: ServiceProviders-dev
    BACKOFFICE_TABLE: doevents-backoffice-dev-users
    DYNAMODB_REGION: sa-east-1
    COGNITO_REGION: sa-east-1
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID, ''}
    NOTIFICATIONS_API: https://api-dev.doeventsapp.com/notifications/trigger-notification
    WEB_APP_BASE_URL: https://dev.doeventsapp.com
    FAV_TABLE: userFavoriteEvents-dev
    SERVICE_RATINGS_TABLE: ServiceCalification-dev
    STAGE: dev
    AI_INTERACTIONS_TABLE: AIInteractions-dev
    REPORTS_TABLE: Reports-dev
    FEED_PUBLICATIONS_TABLE: FeedPublications-dev
    FEED_COMMENTS_TABLE: FeedComments-dev
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:DeleteItem
        - dynamodb:UpdateItem
        - dynamodb:Scan
        - dynamodb:Query
      Resource:
        - arn:aws:dynamodb:sa-east-1:*:table/Client-dev
        - arn:aws:dynamodb:sa-east-1:*:table/Eventos-dev
        - arn:aws:dynamodb:sa-east-1:*:table/Eventos-dev/index/*
        - arn:aws:dynamodb:sa-east-1:*:table/Orders-dev
        - arn:aws:dynamodb:sa-east-1:*:table/Orders-dev/index/*
        - arn:aws:dynamodb:sa-east-1:*:table/Venues-dev
        - arn:aws:dynamodb:sa-east-1:*:table/VenuePromoCodes-dev
        - arn:aws:dynamodb:sa-east-1:*:table/ServicePromoCodes-dev
        - arn:aws:dynamodb:sa-east-1:*:table/ServiceProviders-dev
        - arn:aws:dynamodb:sa-east-1:*:table/doevents-backoffice-dev-users
        - arn:aws:dynamodb:sa-east-1:*:table/doevents-backoffice-dev-users/index/*
        - arn:aws:dynamodb:sa-east-1:*:table/ServiceProviders-dev/index/*
        - arn:aws:dynamodb:sa-east-1:*:table/userFavoriteEvents-dev
        - arn:aws:dynamodb:sa-east-1:*:table/userFavoriteEvents-dev/index/*
        - arn:aws:dynamodb:sa-east-1:*:table/ServiceCalification-dev
        - arn:aws:dynamodb:sa-east-1:*:table/AIInteractions-dev
        - arn:aws:dynamodb:sa-east-1:*:table/AIInteractions-dev/index/*
        - arn:aws:dynamodb:sa-east-1:*:table/Reports-dev
        - arn:aws:dynamodb:sa-east-1:*:table/FeedPublications-dev
        - arn:aws:dynamodb:sa-east-1:*:table/FeedComments-dev
    - Effect: Allow
      Action:
        - cognito-idp:AdminSetUserPassword
        - cognito-idp:AdminGetUser
        - cognito-idp:AdminDisableUser
        - cognito-idp:AdminEnableUser
      Resource: '*'

functions:
  getDashboard:
    handler: src/handler.getDashboard
    events:
      - http:
          path: dashboard
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - X-User-Id
              - x-user-id
            allowCredentials: false

