org: events
service: aws-lambda-backoffice

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-2
  stage: qa
  environment:
    CLIENT_TABLE: Client-qa
    EVENTS_TABLE: Eventos-qa
    ORDERS_TABLE: Orders-qa
    VENUES_TABLE: Venues-qa
    SERVICES_TABLE: ServiceProviders-qa
    BACKOFFICE_TABLE: doevents-backoffice-qa-users
    DYNAMODB_REGION: us-east-2
    COGNITO_REGION: us-east-2
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID, ''}
    NOTIFICATIONS_API: https://api-qa.doeventsapp.com/notifications/trigger-notification
    WEB_APP_BASE_URL: https://qa.doeventsapp.com
    FAV_TABLE: userFavoriteEvents-qa
    SERVICE_RATINGS_TABLE: ServiceCalification-qa
    STAGE: qa
    AI_INTERACTIONS_TABLE: AIInteractions-qa
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:DeleteItem
        - dynamodb:UpdateItem
        - dynamodb:Scan
        - dynamodb:Query
      Resource:
        - arn:aws:dynamodb:us-east-2:*:table/Client-qa
        - arn:aws:dynamodb:us-east-2:*:table/Eventos-qa
        - arn:aws:dynamodb:us-east-2:*:table/Eventos-qa/index/*
        - arn:aws:dynamodb:us-east-2:*:table/Orders-qa
        - arn:aws:dynamodb:us-east-2:*:table/Orders-qa/index/*
        - arn:aws:dynamodb:us-east-2:*:table/Venues-qa
        - arn:aws:dynamodb:us-east-2:*:table/ServiceProviders-qa
        - arn:aws:dynamodb:us-east-2:*:table/doevents-backoffice-qa-users
        - arn:aws:dynamodb:us-east-2:*:table/doevents-backoffice-qa-users/index/*
        - arn:aws:dynamodb:us-east-2:*:table/ServiceProviders-qa/index/*
        - arn:aws:dynamodb:us-east-2:*:table/userFavoriteEvents-qa
        - arn:aws:dynamodb:us-east-2:*:table/userFavoriteEvents-qa/index/*
        - arn:aws:dynamodb:us-east-2:*:table/ServiceCalification-qa
        - arn:aws:dynamodb:us-east-2:*:table/AIInteractions-qa
        - arn:aws:dynamodb:us-east-2:*:table/AIInteractions-qa/index/*
    - Effect: Allow
      Action:
        - cognito-idp:AdminSetUserPassword
        - cognito-idp:AdminGetUser
        - cognito-idp:AdminDisableUser
        - cognito-idp:AdminEnableUser
      Resource: '*'

functions:
  getDashboard:
    handler: src/handler.getDashboard
    events:
      - http:
          path: dashboard
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - X-User-Id
              - x-user-id
            allowCredentials: false

