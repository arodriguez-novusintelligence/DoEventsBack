org: events
service: aws-lambda-services
frameworkVersion: "3"

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-2
  stage: qa
  environment:
    SERVICES_TABLE: ServiceProviders-qa
    SERVICE_RATINGS_TABLE: ServiceCalification-qa
    CLIENT_TABLE: Client-qa
    ORDERS_TABLE: Orders-qa
    SERVICE_BOOKINGS_TABLE: ServiceBookings-qa
    SERVICE_LIKES_TABLE: Service_Likes-qa
    NOTIFICATIONS_LAMBDA: notifications-qa-triggerNotification
    DYNAMODB_REGION: us-east-2
    PROFILE_IMAGES_BUCKET: doevents-profile-media-qa
    PROFILE_BUCKET: doevents-profile-media-qa
    PROFILE_BUCKET_REGION: us-east-2
    ENTITY_MEDIA_BUCKET: doevent-venue-images
    ENTITY_MEDIA_REGION: us-east-1
    VENUE_IMAGES_BUCKET: doevent-venue-images
    CORS_ALLOWED_ORIGINS: https://qa.doeventsapp.com,http://localhost:5173,https://localhost,capacitor://localhost
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:Scan
        - dynamodb:GetItem
        - dynamodb:Query
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
      Resource:
        - arn:aws:dynamodb:us-east-2:519010577666:table/ServiceProviders-qa
        - arn:aws:dynamodb:us-east-2:519010577666:table/ServiceCalification-qa
        - arn:aws:dynamodb:us-east-2:519010577666:table/ServiceCalification-qa/index/*
        - arn:aws:dynamodb:us-east-2:519010577666:table/Client-qa
        - arn:aws:dynamodb:us-east-2:519010577666:table/Orders-qa
        - arn:aws:dynamodb:us-east-2:519010577666:table/ServiceBookings-qa
        - arn:aws:dynamodb:us-east-2:519010577666:table/ServiceBookings-qa/index/*
        - arn:aws:dynamodb:us-east-2:519010577666:table/Service_Likes-qa
        - arn:aws:dynamodb:us-east-2:519010577666:table/Service_Likes-qa/index/*
    - Effect: Allow
      Action:
        - s3:GetObject
        - s3:PutObject
        - s3:CopyObject
      Resource:
        - arn:aws:s3:::doeventprofileimagesbucket/*
        - arn:aws:s3:::doevents-profile-media-qa/*
        - arn:aws:s3:::doevent-venue-images/*
    - Effect: Allow
      Action:
        - dynamodb:GetItem
      Resource:
        - arn:aws:dynamodb:us-east-2:519010577666:table/Client-qa
    - Effect: Allow
      Action:
        - lambda:InvokeFunction
      Resource:
        - arn:aws:lambda:us-east-2:519010577666:function:notifications-qa-triggerNotification

functions:
  getNearby:
    handler: src/getNearby.handler
    events:
      - httpApi:
          path: /nearby
          method: post
  getById:
    handler: src/getById.handler
    events:
      - httpApi:
          path: /{serviceId}
          method: get
  getByUserId:
    handler: src/getByUserId.handler
    events:
      - httpApi:
          path: /users/{userId}
          method: get
  listCategories:
    handler: src/listCategories.handler
    events:
      - httpApi:
          path: /categories
          method: get
  createService:
    handler: src/createService.handler
    events:
      - httpApi:
          path: /
          method: post
  rateService:
    handler: src/rateService.handler
    events:
      - httpApi:
          path: /{serviceId}/rate
          method: post
  deleteService:
    handler: src/deleteService.handler
    events:
      - httpApi:
          path: /{serviceId}
          method: delete
  updateService:
    handler: src/updateService.handler
    events:
      - httpApi:
          path: /{serviceId}
          method: put
  assignServiceCoAdmin:
    handler: src/assignServiceCoAdmin.handler
    events:
      - httpApi:
          path: /{serviceId}/co-admins
          method: post
  getServiceBookingAvailability:
    handler: src/getServiceBookingAvailabilityHandler.handler
    events:
      - httpApi:
          path: /{serviceId}/bookings/availability
          method: get
  createServiceBooking:
    handler: src/createServiceBookingHandler.handler
    events:
      - httpApi:
          path: /{serviceId}/bookings
          method: post
  getUserServiceBookings:
    handler: src/getUserServiceBookingsHandler.handler
    events:
      - httpApi:
          path: /bookings/user/{userId}
          method: get
  likeService:
    handler: src/likeServiceHandler.handler
    events:
      - httpApi:
          path: /{serviceId}/like
          method: post
  getServiceLikeByUser:
    handler: src/getServiceLikeByUserHandler.handler
    events:
      - httpApi:
          path: /{serviceId}/like/user/{userId}
          method: get

resources:
  Resources:
    ServiceProvidersTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ServiceProviders-qa
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: serviceId
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
          - AttributeName: category
            AttributeType: S
        KeySchema:
          - AttributeName: serviceId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: userIdIndex
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: categoryIndex
            KeySchema:
              - AttributeName: category
                KeyType: HASH
            Projection:
              ProjectionType: ALL
    ServiceCalificationTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ServiceCalification-qa
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: serviceId
            AttributeType: S
          - AttributeName: calificationId
            AttributeType: S
        KeySchema:
          - AttributeName: serviceId
            KeyType: HASH
          - AttributeName: calificationId
            KeyType: RANGE
    ServiceBookingsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ServiceBookings-qa
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: serviceId
            AttributeType: S
          - AttributeName: bookingId
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
          - AttributeName: created_at_ts
            AttributeType: N
        KeySchema:
          - AttributeName: serviceId
            KeyType: HASH
          - AttributeName: bookingId
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: userIdIndex
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
              - AttributeName: created_at_ts
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
    ServiceLikesTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: Service_Likes-qa
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
          - AttributeName: serviceId
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
          - AttributeName: serviceId
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: serviceIdIndex
            KeySchema:
              - AttributeName: serviceId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
