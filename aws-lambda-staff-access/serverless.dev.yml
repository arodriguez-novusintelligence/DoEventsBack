org: events
service: staff-access
frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs20.x
  region: sa-east-1
  stage: dev
  environment:
    STAFF_ACCESS_TABLE_NAME: StaffAccess-dev
    USERS_TABLE: Client-dev
    EVENTS_TABLE: Eventos-dev
    VENUES_TABLE: Venues-dev
    NOTIFICATIONS_FUNCTION: notifications-dev-triggerNotification
    PROFILE_IMAGES_BUCKET: doeventprofileimagesbucket
    PROFILE_IMAGES_BUCKET_REGION: us-east-1
    CORS_ALLOWED_ORIGINS: https://dev.doeventsapp.com,http://localhost:5173,https://localhost,capacitor://localhost
    DYNAMODB_REGION: sa-east-1
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:GetItem
            - dynamodb:BatchGetItem
            - dynamodb:PutItem
            - dynamodb:DeleteItem
            - dynamodb:BatchWriteItem
          Resource:
            - arn:aws:dynamodb:sa-east-1:519010577666:table/StaffAccess-dev
            - arn:aws:dynamodb:sa-east-1:519010577666:table/StaffAccess-dev/index/*
        - Effect: Allow
          Action:
            - dynamodb:BatchGetItem
            - dynamodb:GetItem
            - dynamodb:Query
          Resource:
            - arn:aws:dynamodb:sa-east-1:519010577666:table/Client-dev
            - arn:aws:dynamodb:sa-east-1:519010577666:table/Client-dev/index/*
            - arn:aws:dynamodb:sa-east-1:519010577666:table/Eventos-dev
            - arn:aws:dynamodb:sa-east-1:519010577666:table/Eventos-dev/index/*
            - arn:aws:dynamodb:sa-east-1:519010577666:table/Venues-dev
            - arn:aws:dynamodb:sa-east-1:519010577666:table/Venues-dev/index/*
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource:
            - arn:aws:lambda:sa-east-1:519010577666:function:notifications-dev-triggerNotification
        - Effect: Allow
          Action:
            - s3:GetObject
          Resource:
            - arn:aws:s3:::doeventprofileimagesbucket/*

package:
  patterns:
    - '!node_modules/**'
    - 'dist/**'

functions:
  saveAssignments:
    handler: dist/handler.saveAssignments
    events:
      - http:
          path: assignments
          method: post
          cors: true
  getAdminView:
    handler: dist/handler.getAdminView
    events:
      - http:
          path: admin/events/{eventId}
          method: get
          cors: true
  getEventsStaffSummary:
    handler: dist/handler.getEventsStaffSummary
    events:
      - http:
          path: admin/events-summary
          method: get
          cors: true
  getStaffView:
    handler: dist/handler.getStaffView
    events:
      - http:
          path: staff/{userId}
          method: get
          cors: true

# Tabla StaffAccess-dev ya existe en sa-east-1
