org: events
service: staff-access

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  environment:
    STAFF_ACCESS_TABLE_NAME:
      Ref: StaffAccessTable
    USERS_TABLE: ${env:USERS_TABLE, 'Client'}
    EVENTS_TABLE: ${env:EVENTS_TABLE, 'Eventos'}
    VENUES_TABLE: ${env:VENUES_TABLE, 'Venues'}
    NOTIFICATIONS_FUNCTION: notifications-${opt:stage, 'dev'}-triggerNotification
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:GetItem
            - dynamodb:BatchGetItem
            - dynamodb:PutItem
            - dynamodb:DeleteItem
            - dynamodb:BatchWriteItem
          Resource:
            - Fn::GetAtt: [StaffAccessTable, Arn]
            - Fn::Sub: ["${TableArn}/index/*", { TableArn: { Fn::GetAtt: [StaffAccessTable, Arn] } }]
        # Optional: only if USERS_TABLE is set (e.g. Client) to enrich admin view with user name/email
        - Effect: Allow
          Action:
            - dynamodb:BatchGetItem
            - dynamodb:GetItem
          Resource:
            - arn:aws:dynamodb:${aws:region}:*:table/Client
        # Eventos y Venues para devolver info completa en events-summary (Query por userId en GSI)
        - Effect: Allow
          Action:
            - dynamodb:BatchGetItem
            - dynamodb:GetItem
            - dynamodb:Query
          Resource:
            - arn:aws:dynamodb:${aws:region}:*:table/Eventos
            - arn:aws:dynamodb:${aws:region}:*:table/Eventos/index/*
            - arn:aws:dynamodb:${aws:region}:*:table/Venues
        # Invocar Lambda de notificaciones (push, inApp, email) al asignar staff
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource:
            - arn:aws:lambda:${aws:region}:*:function:notifications-*-triggerNotification
        # Foto de perfil del dueño del evento (signed URL) en getStaffView
        - Effect: Allow
          Action:
            - s3:GetObject
          Resource:
            - arn:aws:s3:::doeventprofileimagesbucket/*

package:
  patterns:
    - '!node_modules/**'
    - 'dist/**'
    - 'node_modules/**'

functions:
  # POST: guardar asignaciones de staff a puertas
  saveAssignments:
    handler: dist/handler.saveAssignments
    events:
      - http:
          path: staff-access/assignments
          method: post
          cors: true

  # GET: vista admin por eventId (asignaciones agrupadas por puerta)
  getAdminView:
    handler: dist/handler.getAdminView
    events:
      - http:
          path: staff-access/admin/events/{eventId}
          method: get
          cors: true

  # GET: resumen de control de staff por userId (eventIds derivados de sus asignaciones)
  getEventsStaffSummary:
    handler: dist/handler.getEventsStaffSummary
    events:
      - http:
          path: staff-access/admin/events-summary
          method: get
          cors: true

  # GET: vista staff por userId (asignaciones del usuario)
  getStaffView:
    handler: dist/handler.getStaffView
    events:
      - http:
          path: staff-access/staff/{userId}
          method: get
          cors: true

resources:
  Resources:
    StaffAccessTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: StaffAccess
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
          - AttributeName: eventId
            AttributeType: S
          - AttributeName: gateId
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: AdminEventIndex
            KeySchema:
              - AttributeName: eventId
                KeyType: HASH
              - AttributeName: gateId
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

# Compilar antes de desplegar: npm run build && serverless deploy
