org: events
service: aws-lambda-DatosBancarios
frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs24.x
  region: sa-east-1
  stage: dev
  environment:
    DATOS_BANCARIOS_TABLE: DatosBancarios-dev
    DYNAMODB_REGION: sa-east-1
    CORS_ALLOWED_ORIGINS: https://dev.doeventsapp.com,http://localhost:5173,https://localhost,capacitor://localhost
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:Query
        - dynamodb:Scan
        - dynamodb:DeleteItem
      Resource:
        - arn:aws:dynamodb:sa-east-1:519010577666:table/DatosBancarios-dev
        - arn:aws:dynamodb:sa-east-1:519010577666:table/DatosBancarios-dev/index/*
    - Effect: Allow
      Action:
        - s3:PutObject
        - s3:GetObject
        - s3:DeleteObject
      Resource:
        - arn:aws:s3:::lambdadatobdocumento/*
        - arn:aws:s3:::lambdadatobcertificado/*
        - arn:aws:s3:::lambdadatobcertificadocamaracomercio/*
        - arn:aws:s3:::certificadosrutdatosbancarios/*

package:
  patterns:
    - "!.serverless/**"
    - "!doc/**"
    - "!readme.md"
    - "!node_modules/aws-crt/**"

functions:
  swaggerDocs:
    handler: src/swaggerDocs.swaggerDocs
    events:
      - httpApi:
          path: /doc
          method: get
      - httpApi:
          path: /doc/swagger-bank-details.yml
          method: get
  crearDatosBancarios:
    handler: src/createBankData.crearDatosBancarios
    events:
      - httpApi:
          path: /crearDatosBancarios
          method: post
  obtenerDatosBancarios:
    handler: src/getBankData.obtenerDatosBancariosPorId
    events:
      - httpApi:
          path: /obtenerDatosBancarios/{id}
          method: get
  obtenerDatosBancariosByUser:
    handler: src/getBankDataByUserId.obtenerDatosBancariosByUserId
    events:
      - httpApi:
          path: /obtenerDatosBancariosByUserId/{userID}
          method: get
  actualizarDatosBancarios:
    handler: src/updateBankData.updateBankData
    events:
      - httpApi:
          path: /actualizarDatosBancarios
          method: post
  setDatoBancarioPredeterminado:
    handler: src/setBankDataDefault.setBankDataDefault
    events:
      - httpApi:
          path: /datosBancarios/{id}/predeterminado
          method: patch
