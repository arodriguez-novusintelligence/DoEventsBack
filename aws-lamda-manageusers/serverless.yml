# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: events
# "service" is the name of this project. This will also be added to your AWS resource names.
service: aws-lambda-manageusers

package:
  patterns:
    - "!**"
    - "src/**"
    - "package.json"
    - "node_modules/**"
    - "!node_modules/serverless/**"
    - "!node_modules/serverless-offline/**"
    - "!node_modules/@esbuild/**"
    - "!node_modules/java-invoke-local/**"
    - "!node_modules/@types/**"
    - "!node_modules/.bin/**"
    - "!_lambda_patch/**"
    - "!_patch_search/**"
    - "!.deploy-getuser/**"
    - "!**/*.zip"
    - "!**/*.md"
    - "!.serverless/**"

provider:
  name: aws
  runtime: nodejs24.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  environment:
    CLIENT_TABLE: Client
    FAVORITE_USERS_TABLE: FavoriteUsers
    IMAGE_TABLE: imagenes
    EVENTS_TABLE: Eventos
    ORDERS_TABLE: Orders
    EVENT_INVITATIONS_TABLE: EventInvitations
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:*
        - s3:PutObject
        - s3:GetObject
        - s3:DeleteObject
      Resource:
        - arn:aws:dynamodb:us-east-1:519010577666:table/Client
        - arn:aws:dynamodb:us-east-1:519010577666:table/Client/index/EmailIndex
        - arn:aws:dynamodb:us-east-1:519010577666:table/Client/index/userIndex
        - arn:aws:dynamodb:us-east-1:519010577666:table/Client/index/PhoneIndex # Añadir el PhoneIndex
        - arn:aws:dynamodb:us-east-1:519010577666:table/Eventos
        - arn:aws:dynamodb:us-east-1:519010577666:table/Eventos/index/userIdIndex
        - arn:aws:dynamodb:us-east-1:519010577666:table/userFavoriteEvents
        - arn:aws:dynamodb:us-east-1:519010577666:table/Orders
        - arn:aws:dynamodb:us-east-1:519010577666:table/Orders/index/user_id-created_at-index
        - arn:aws:dynamodb:us-east-1:519010577666:table/FavoriteUsers
        - arn:aws:dynamodb:us-east-1:519010577666:table/FavoriteUsers/index/GSI-email
        - arn:aws:dynamodb:us-east-1:519010577666:table/FavoriteUsers/index/GSI-phone
        - arn:aws:dynamodb:us-east-1:519010577666:table/FavoriteUsers/index/GSI-username
        - arn:aws:dynamodb:us-east-1:519010577666:table/FavoriteUsers/index/GSI-followers
        - arn:aws:dynamodb:us-east-1:519010577666:table/EventInvitations
        - arn:aws:dynamodb:us-east-1:519010577666:table/EventInvitations/index/*
        - arn:aws:dynamodb:us-east-1:519010577666:table/FeedPublications
        - arn:aws:dynamodb:us-east-1:519010577666:table/FeedPublications/index/*
        - arn:aws:dynamodb:us-east-1:519010577666:table/FeedPublicationLikes
        - arn:aws:dynamodb:us-east-1:519010577666:table/FeedPublicationLikes/index/*
        - arn:aws:dynamodb:us-east-1:519010577666:table/imagenes
        - arn:aws:dynamodb:us-east-1:519010577666:table/imagenes/index/eventIdIndex
        - arn:aws:s3:::doeventprofileimagesbucket
        - arn:aws:s3:::doeventprofileimagesbucket/*
        - arn:aws:s3:::doeventimageeventbucket/*
    - Effect: Allow
      Action:
        - lambda:InvokeFunction
      Resource:
        - arn:aws:lambda:us-east-1:519010577666:function:aws-lambda-auditeventlog-dev*
functions:
  createUser:
    handler: src/addUser.addUser
    events:
      - httpApi:
          path: /createUser
          method: post
  createUserRRSS:
    handler: src/addUser.addUserRRSS
    events:
      - httpApi:
          path: /createUserRRSS
          method: post
  getUser:
    handler: src/getUser.getUser
    events:
      - httpApi:
          path: /getUser/{id}
          method: get
  updateUser:
    handler: src/updateUser.updateUser
    events:
      - httpApi:
          path: /updateUser
          method: post
  getUserByEmail:
    handler: src/getUserByEmail.getUser
    events:
      - httpApi:
          path: /getUserByEmail/{email}
          method: get
  getUserStats:
    handler: src/userStats.handler
    events:
      - httpApi:
          path: /getUserStats/{userId}
          method: get
  updateUserProfileVisibility:
    handler: src/updateUserProfileVisibility.updateUserProfileVisibility
    events:
      - httpApi:
          path: /updateUserProfileVisibility
          method: put
  searchUsers:
    handler: src/searchUsers.searchUsers
    events:
      - httpApi:
          path: /searchUsers
          method: get
  getUserInvitations:
    handler: src/getUserInvitations.getUserInvitations
    events:
      - httpApi:
          path: /users/{userId}/invitations
          method: get
  createProfileImagesUploadUrls:
    handler: src/profileMediaHandlers.createProfileImagesUploadUrls
    events:
      - httpApi:
          path: /users/{userId}/profile-images/upload-urls
          method: post
  upsertProfileImages:
    handler: src/profileMediaHandlers.upsertProfileImages
    events:
      - httpApi:
          path: /users/{userId}/profile-images
          method: put
  listProfileImages:
    handler: src/profileMediaHandlers.listProfileImages
    events:
      - httpApi:
          path: /users/{userId}/profile-images
          method: get
  deleteProfileImage:
    handler: src/profileMediaHandlers.deleteProfileImage
    events:
      - httpApi:
          path: /users/{userId}/profile-images/{imageId}
          method: delete
  createCoverUploadUrl:
    handler: src/profileMediaHandlers.createCoverUploadUrl
    events:
      - httpApi:
          path: /users/{userId}/cover/upload-url
          method: post
  upsertCoverImage:
    handler: src/profileMediaHandlers.upsertCoverImage
    events:
      - httpApi:
          path: /users/{userId}/cover
          method: put
  deleteCoverImage:
    handler: src/profileMediaHandlers.deleteCoverImage
    events:
      - httpApi:
          path: /users/{userId}/cover
          method: delete
  setFavoriteProfile:
    handler: src/profileFavoritesHandlers.setFavoriteProfile
    events:
      - httpApi:
          path: /users/{userId}/favorite-profiles/{targetUserId}
          method: put
  listFavoriteProfiles:
    handler: src/profileFavoritesHandlers.listFavoriteProfiles
    events:
      - httpApi:
          path: /users/{userId}/favorite-profiles
          method: get
  listProfilesWhoFavoritedMe:
    handler: src/profileFavoritesHandlers.listProfilesWhoFavoritedMe
    events:
      - httpApi:
          path: /users/{userId}/favorited-by
          method: get
      - httpApi:
          path: /users/{userId}/favorite-profiles/received
          method: get
      - httpApi:
          path: /users/{userId}/likes-received
          method: get
      - httpApi:
          path: /users/{userId}/favorites-received
          method: get
