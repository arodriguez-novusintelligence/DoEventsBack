# Esta plantilla de AWS SAM se ha generado a partir de la configuración de su
# función. Si su función tiene uno o más desencadenadores, tenga en cuenta que los
# recursos de AWS asociados a estos desencadenadores no están completamente
# especificados en esta plantilla e incluyen valores de marcadores de posición.
# Abra esta plantilla en AWS Infrastructure Composer o en su IDE favorito y
# modifíquela para especificar una aplicación sin servidor con otros recursos de
# AWS.
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: An AWS Serverless Application Model template describing your function.
Resources:
  awslambdalogindevlogin:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Description: ''
      MemorySize: 1024
      Timeout: 6
      Handler: src/login.handler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          JWT_SECRET: >-
            arn:aws:ssm:us-east-1:519010577666:parameter/doevent/login/JWT_SECRET
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 21600
        MaximumRetryAttempts: 2
      PackageType: Zip
      Policies:
        - Statement:
            - Action:
                - logs:CreateLogStream
                - logs:CreateLogGroup
                - logs:TagResource
              Resource:
                - >-
                  arn:aws:logs:us-east-1:519010577666:log-group:/aws/lambda/aws-lambda-login-dev*:*
              Effect: Allow
            - Action:
                - logs:PutLogEvents
              Resource:
                - >-
                  arn:aws:logs:us-east-1:519010577666:log-group:/aws/lambda/aws-lambda-login-dev*:*:*
              Effect: Allow
            - Action:
                - dynamodb:*
                - s3:PutObject
              Resource:
                - arn:aws:dynamodb:us-east-1:519010577666:table/Client
                - >-
                  arn:aws:dynamodb:us-east-1:519010577666:table/Client/index/EmailIndex
                - arn:aws:dynamodb:us-east-1:519010577666:table/UserPreferences
              Effect: Allow
      RecursiveLoop: Terminate
      SnapStart:
        ApplyOn: None
      Tags:
        STAGE: dev
      Events:
        Api1:
          Type: Api
          Properties:
            Path: /MyResource
            Method: ANY
        Api2:
          Type: Api
          Properties:
            Path: /login
            Method: ANY
      RuntimeManagementConfig:
        UpdateRuntimeOn: Auto
