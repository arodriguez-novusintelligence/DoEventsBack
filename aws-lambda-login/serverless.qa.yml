org: events
service: aws-lambda-login
frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs24.x
  region: us-east-2
  stage: qa
  environment:
    JWT_SECRET: arn:aws:ssm:us-east-1:519010577666:parameter/doevent/login/JWT_SECRET
    CLIENT_TABLE: Client-qa
    FAVORITE_USERS_TABLE: FavoriteUsers-qa
    USER_PREFERENCES_TABLE: UserPreferences-qa
    BACKOFFICE_TABLE: doevents-backoffice-qa-users
    BACKOFFICE_REGION: us-east-2
    DYNAMODB_REGION: us-east-2
    APPLE_CALLBACK_LANDING_URL: https://qa.doeventsapp.com/apple-callback
    APPLE_SERVICES_ID: ${env:APPLE_SERVICES_ID, ''}
    FACEBOOK_APP_ID: ${env:FACEBOOK_APP_ID, '696770136864604'}
    FACEBOOK_APP_SECRET: ${env:FACEBOOK_APP_SECRET, ''}
    DATA_DELETION_STATUS_URL: https://qa.doeventsapp.com/auth/data-deletion
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:Query
        - dynamodb:Scan
      Resource:
        - arn:aws:dynamodb:us-east-2:519010577666:table/Client-qa
        - arn:aws:dynamodb:us-east-2:519010577666:table/Client-qa/index/*
        - arn:aws:dynamodb:us-east-2:519010577666:table/UserPreferences-qa
        - arn:aws:dynamodb:us-east-2:519010577666:table/UserPreferences-qa/index/*
        - arn:aws:dynamodb:us-east-2:519010577666:table/FavoriteUsers-qa
        - arn:aws:dynamodb:us-east-2:519010577666:table/FavoriteUsers-qa/index/*
        - arn:aws:dynamodb:us-east-2:519010577666:table/doevents-backoffice-qa-users
        - arn:aws:dynamodb:us-east-2:519010577666:table/doevents-backoffice-qa-users/index/*
    - Effect: Allow
      Action:
        - ssm:GetParameter
      Resource:
        - arn:aws:ssm:us-east-1:519010577666:parameter/doevent/login/JWT_SECRET

functions:
  login:
    handler: src/login.handler
    events:
      - httpApi:
          path: /login
          method: post
  googleAuth:
    handler: src/login.googleAuth
    events:
      - httpApi:
          path: /googleOAuth
          method: post
  facebookAuth:
    handler: src/login.facebookAuth
    events:
      - httpApi:
          path: /facebookOAuth
          method: post
  facebookDataDeletion:
    handler: src/facebookDataDeletion.facebookDataDeletion
    events:
      - httpApi:
          path: /facebookDataDeletion
          method: post
      - httpApi:
          path: /facebookDataDeletion
          method: get
  appleAuth:
    handler: src/login.appleAuth
    events:
      - httpApi:
          path: /appleOAuth
          method: post
  appleCallback:
    handler: src/login.appleCallback
    events:
      - httpApi:
          path: /apple-callback
          method: post
      - httpApi:
          path: /apple-callback
          method: get

package:
  patterns:
    - 'src/**'
    - 'package.json'
    - 'package-lock.json'
    - 'node_modules/**'
    - '!**/*.md'
    - '!**/*.test.js'
