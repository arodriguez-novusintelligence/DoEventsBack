org: events
service: aws-lambda-subscriptions

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-2
  stage: qa
  environment:
    CLIENT_TABLE: Client-qa
    EVENTS_TABLE: Eventos-qa
    ORDERS_TABLE: Orders-qa
    SUBSCRIPTIONS_TABLE: Subscriptions-qa
    DYNAMODB_REGION: us-east-2
    STAGE: qa
    PRO_AMOUNT_USD: 70
    WOMPI_PRIVATE_KEY: ${env:WOMPI_PRIVATE_KEY, ''}
    WOMPI_PUBLIC_KEY: ${env:WOMPI_PUBLIC_KEY, ''}
    WOMPI_REDIRECT_BASE_URL: ${env:WOMPI_REDIRECT_BASE_URL, 'https://qa.doeventsapp.com/payment-finally'}
    WOMPI_API_BASE_URL: ${env:WOMPI_API_BASE_URL, 'https://sandbox.wompi.co/v1'}
    WOMPI_WEBHOOK_URL: ${env:WOMPI_WEBHOOK_URL, ''}
    NOTIFICATIONS_API: https://api-qa.doeventsapp.com/notifications/trigger-notification
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:Query
        - dynamodb:Scan
      Resource:
        - arn:aws:dynamodb:us-east-2:*:table/Client-qa
        - arn:aws:dynamodb:us-east-2:*:table/Eventos-qa
        - arn:aws:dynamodb:us-east-2:*:table/Eventos-qa/index/*
        - arn:aws:dynamodb:us-east-2:*:table/Subscriptions-qa
        - arn:aws:dynamodb:us-east-2:*:table/Subscriptions-qa/index/*

functions:
  getSubscriptionStatus:
    handler: src/handler.getSubscriptionStatus
    events:
      - http:
          path: status/{userId}
          method: get
          cors: true

  checkPublishLimit:
    handler: src/handler.checkPublishLimit
    events:
      - http:
          path: check-limit
          method: post
          cors: true

  createProCheckout:
    handler: src/handler.createProCheckout
    events:
      - http:
          path: pro/checkout
          method: post
          cors: true

  proPaymentWebhook:
    handler: src/handler.proPaymentWebhook
    events:
      - http:
          path: pro/webhook
          method: post
          cors: true

  confirmProPayment:
    handler: src/handler.confirmProPayment
    events:
      - http:
          path: pro/confirm
          method: post
          cors: true

  cancelPro:
    handler: src/handler.cancelPro
    events:
      - http:
          path: pro/cancel
          method: post
          cors: true
